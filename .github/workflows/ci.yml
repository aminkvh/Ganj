# Checks every push and pull request: static analysis and the test suite.
# Tests run on Windows, where the golden images were rendered.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.47.6, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --exclude-tags golden
