# Checks every push and pull request: static analysis and the test suite.
# Tests run on Windows, where the golden images were rendered.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.47.6, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --exclude-tags golden

  # Compile the Linux app on every push too (its runner has platform code that tests can't see).
  linux-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.47.6, cache: true }
      - run: flutter build linux --release
